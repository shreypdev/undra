# ---------------------------------------------------------------------------------------------
# Ratios between two layer A rows of the same run (bench review M1). Rule in the header. The
# healthy samples behind each `max` are the reference host (budgets.toml's measured_ns, and a quiet
# run) and the twelve runner runs; `measured` is the quiet host. An operation that is `*_x1000`
# runs 1,000 operations per iteration, hence the `_div`.
# ---------------------------------------------------------------------------------------------

# What a transaction commit (an update, the change-set, delivery to a counting host) costs against
# a bare method call that writes nothing: `Calculator.add` through `call_sync`. The tightest gate
# here: healthy 1.24-1.94 on every sample, 3.1 on the reference host with the commit path made 1.8x
# slower on purpose (bench/RESULTS.md, "Gates that catch a 2x regression"), 2.3 maximum.
[ratio."commit_vs_bare_call"]
num = "stress/firehose/txn_x1000"
num_div = 1000
den = "dispatch/call_sync/add"
max = 2.3
measured = 1.75

# The same relationship through the host-facing path: `Ticker.set` through `call_sync` (decode,
# dispatch, write, commit, delivery, reply) against the bare call. Healthy 2.25-3.05; 5.1 with the
# commit 1.8x slower on the reference host.
[ratio."set_vs_bare_call"]
num = "stress/firehose/call_set"
den = "dispatch/call_sync/add"
max = 3.6
measured = 3.05

# An event through `Runtime::event` costs about what a call does: both end in the same commit.
# Healthy 0.76-0.93. Catches the event path alone getting costlier.
[ratio."event_vs_set"]
num = "stress/firehose/event"
den = "stress/firehose/call_set"
max = 1.1
measured = 0.85

# An instantiation of a generic function dispatches like the function written by hand (ADR-058): the
# same body, the same path, so the ratio is 1 up to noise: 0.89-1.04 over six runs on the reference host
# (the ADR asked for 1.1; the rule above, 1.15x the largest healthy sample rounded up to 0.1, gives 1.2,
# and a tighter bound would fail on the noise of two ~40 ns rows). A second dispatch hop, a table lookup
# per call or a copy of the arguments for generic code would each be 1.3x or more.
[ratio."generic_fn_vs_function"]
num = "dispatch/call_sync/generic_fn"
den = "dispatch/call_sync/function"
max = 1.2
measured = 1.0

# An object parameter costs a table lookup on top of a bare call: `Calculator.dock_slots(&Dock)` through
# `call_sync` against `Calculator.add`. Healthy 0.99-1.14 on the reference host (quiet and loaded). No
# runner samples exist yet, so the maximum is the bound of what it guards (an object resolved by a
# scan, a lock per argument, a copy of the object per call would each put it past 2) and not 1.15x of the
# largest sample; tighten it from the first runner runs that record it.
[ratio."object_param_vs_bare_call"]
num = "dispatch/call_sync/object_param"
den = "dispatch/call_sync/add"
max = 2.0
measured = 1.03

# Commit cost follows the dirty count, not the observed count (the layer B scenario asserts the same
# on its sustained run, at 4x). Cache-bound, so it is the one ratio whose spread across hardware is
# as wide as what it could see: healthy 0.99-2.37 over twelve runner runs. Its first maximum, 2.3
# (1.15x the six runs it was set from), failed a docs-only commit at 2.37 on the very next class of
# runner (36806665630). The bound is now what it guards: commit cost following the observed count
# would put this near 10 (100,000 against 10,000 observed), so 4, the scenario's own bound, sees it
# on every runner, and no cache size seen so far comes near it.
[ratio."fanout_100k_vs_10k_observed"]
num = "stress/fanout/100k_observed_1k_dirty"
den = "stress/fanout/10k_observed_1k_dirty"
max = 4
measured = 1.22

# One recorded list operation on 10,000 rows (commit, delivery, host apply) against a scalar write
# through a call: how much a keyed-list patch costs relative to a signal. Healthy 15-47: this is the
# widest ratio (a memmove-bound operation against an atomics-bound one: the runner runs the list
# 1.2x slower than the host and the call 3x slower), so it guards the host and catches an
# order-of-magnitude shift (an O(list) path coming back) on a runner, not a 2x one.
[ratio."keyed_churn_vs_set"]
num = "stress/keyed_churn_10k/ops_x1000"
num_div = 1000
den = "stress/firehose/call_set"
max = 54
measured = 39.5

# ADR-037: restoring a snapshot an older build wrote (every store migrated structurally) costs at
# most 10x restoring one of this build (the fast path: one fingerprint comparison per store type).
# The bound is the ADR's, not 1.15x a sample; measured 3.1 on the reference host.
[ratio."migrated_vs_fast_restore"]
num = "snapshot/restore_100kb_migrated"
den = "snapshot/restore_100kb"
max = 10
measured = 3.12

# A sorted derived view's sort-key change at 100,000 rows against 10,000: O(log n) per change keeps
# this near 1 through the runtime (healthy 1.04-1.12 on the reference host, loaded and quiet). It is
# cache-bound (a 2.4 MB index against one in L2), so, as the fan-out ratio, its bound is what it
# guards rather than 1.15x of a sample: an O(n) step in the drain would put it near 10, and 4 (the
# ADR-039 bound) sees that on any cache size.
[ratio."derived_sort_scaling"]
num = "signals/derived_100k/sort_key_change"
den = "signals/derived_10k/sort_key_change"
max = 4
measured = 1.10

# A derived view's one-row update against the keyed list's own (both one `update_at` through
# `call_sync` on 10,000 rows): the view costs a small multiple of the source it follows. Healthy
# 1.36-1.65 on the reference host (quiet and loaded). There are no runner samples of it yet, so
# instead of 1.15x the largest host sample (1.9) it takes the one-family runner spread (1.5x, see the
# header): 1.65 x 1.5 = 2.5. ADR-039's design bound was 6; an O(n) step (a materialisation on
# the commit path) would put it above 100.
[ratio."derived_vs_keyed_update"]
num = "signals/derived_10k/update_visible"
den = "signals/keyed_10k/update"
max = 2.5
measured = 1.43

# A page of 50 rows and the invalidation of a list of 100,000 against the same on 10,000: O(window)
# and O(1), so the ratios sit at 1 (healthy 1.0-1.05 for the page, 1.04-1.16 for the invalidation on a
# host at load 20-35). The bound is what they guard rather than 1.15x of a sample: an O(n) step (the
# list cloned or encoded on the way) would put either near 10.
[ratio."lazy_page_scaling"]
num = "lazy/page_50_of_100k"
den = "lazy/page_50_of_10k"
max = 2
measured = 1.01

[ratio."lazy_invalidate_scaling"]
num = "lazy/invalidate"
den = "lazy/invalidate_10k"
max = 2
measured = 1.04

# ADR-043: a page appended by the query client (the call, the fetch task, 50 recorded pushes, the keyed
# patch, delivery) against the same 50 recorded pushes as one store method (call, patch, delivery): the
# fetch machinery on top of a 50-op keyed patch, however long the list. 1.34 on the reference host. The
# maximum is the ADR's own bound (at most twice a 50-op keyed patch), not 1.15x of the one sample: a page
# that cost O(list) (a flattened list rebuilt or encoded per page) would be 10 to 100 here.
[ratio."infinite_append_vs_keyed_push_50"]
num = "query/infinite_append_page_50"
den = "query/keyed_push_50"
max = 2.0
measured = 1.34

# ---------------------------------------------------------------------------------------------
# Sizes of shipped artefacts (ADR-052): measured by `scripts/wasm-size.sh` (the web) and
# `scripts/native-size.sh` (the iOS and Android cores), not by the budgets test. The web artefacts are in
# bytes after gzip (zlib's deflate at level 9), the native ones in the bytes of the file as it ships;
# KB below means 1,000 bytes. The budgets test only checks that each table is consistent with itself and
# with its record (bench/results/web-size.jsonl, bench/results/native-size.jsonl).
#   budget_gzip_bytes    the published budget: never more than this (a native table says budget_bytes)
#   measured_gzip_bytes  the record, written with the JSON by `scripts/wasm-size.sh --record`
#                        (a native table says measured_bytes, written by `scripts/native-size.sh --record`)
#   tolerance            never more than this fraction over the record. A change that grows the
#                        artefact more than that re-records it in the same commit, where review sees
#                        it; a toolchain update that does the same is re-recorded after a look at why.
# The gate is min(budget, floor(record x (1 + tolerance))). UNDRA_BENCH_SCALE never applies.
# ---------------------------------------------------------------------------------------------

# The hello-world web core: the `undra init` template (a store with a keyed list and two computeds,
# a record, an enum, an error, a function; no query) built by `undra build --platform web`
# (release-wasm: opt-level z, LTO fat, panic abort; then wasm-opt -Oz, binaryen 133). The wasm module
# alone: Undra's Rust runtime, the C/wasm ABI shim and the core. The blueprint's 120 KB. Re-recorded by
# persistence-v2 (ADR-037, ADR-049): snapshot layout 2 and the migrating restore (closures, the canonical
# description, the streamed converter) are in every core, since `undra_restore` is; 102,722 -> 119,565.
# Hooks, the value decoder and the E0066 check are linked only by a core that has a `#[undra::migrate]`.
# After main's ABI table (ADR-044) the merged core measured 120,188, over the budget; the persistence-v2 review
# links the standard ports' Rust dispatchers by use (ADR-052 note): 116,731; 116,800 with devtools' inspector seam.
# prod-ops (ADR-046: the Diagnostics port and the panic report, `run_background`, the stats section, the
# trap path's trailer lines) added 2,146 bytes to the merged tree's 117,081: 119,227, 773 under the budget. The
# background run's task table and poll loop are linked only when a task is registered (by use, ADR-052).
[size."web/hello-wasm"]
budget_gzip_bytes = 120000
measured_gzip_bytes = 113052
tolerance = 0.05

# What a hello-world app loads up front of the JavaScript runtime: `@undra/runtime` as the template's
# web/src/undra.ts imports it, tree-shaken and minified by the Vite of the runtime's lockfile
# (scripts/web-size-runtime.mjs): the one chunk of the runtime modules the entry reaches by static imports. The
# generated bindings, the app's loader, the Worker script and the modules only a dynamic import() reaches (the
# wasm-worker and remote transports, the Http/Kv/SecureStore/Fs ports, the framed transports' wire code) are not in
# it; the record reports the latter as `lazy_gzipped`. The blueprint's 8 KB predates the transports, reconnect,
# coalescing and worker mode: ADR-052's decision 2 (2026-10-01) restated it at 24 KB, then 26 KB, for the chunk that
# had every runtime module in it; the amendment of 2026-10-02 (`ts-size-e4`) counts what is loaded up front (25,996
# -> 24,335 by that change of what is measured alone) and cuts it to 21,159: the remote transport, the default
# ports and the framed transports' wire code load on demand (-4,686), the call path's levers (ADR-056) cost 1,510.
# The 16 KB the first restatement aimed at is not reached: what is left is the runtime itself (the amendment says
# what). Gated like the wasm. Restated at 21,800 by the objects-callbacks review (ADR-052, note of 2026-10-02): every
# generated constructor adopts through the identity map of ADR-040, and the mirror carries ADR-041's callback
# entries, in the up-front chunk; loading the identity map lazily was measured and rejected (the note says why).
# prod-ops (ADR-046) restates it at 22,100 (+333 on 21,672): up front, the report loader of the wasm trap path, the page's
# background window with its `pagehide` and `freeze` listeners and the stats fields; `runInBackground`, the report builder
# and the Diagnostics port with its registration and codecs are lazy chunks. The item-by-item verdict, with both pieces'
# bytes, is ADR-052's prod-ops review note.
# ts-runtime-16k (ADR-057) restates it at 16,000 (15,680 recorded, from 22,100: -6,420) without removing behaviour:
# what a `wasm-main` hello page cannot run, or does not run until asked, loads with the thing that needs it (the
# stream support, the waiters behind `observe`, what only a core outside this thread needs, `stats`/`snapshot`/
# `restore`/`runInBackground`, the per-mode `load()` mapping, two rarely thrown error classes, the codecs a schema
# does not name); the typed channel to the in-process host replaces the framed one; and the package publishes two
# builds. What is measured is the one an app gets from the registry: `default` resolves the production build, whose
# messages are `T<code>` with their values and a link (the sentences are the development build's and the errors page's)
# and whose private properties are renamed (`_pending` -> `_c`). Vite's preload helper, which the build adds to whichever
# chunk has an `import()`, is its own chunk and is reported as `bundler_gzipped` (691): not the runtime's code. The record
# lists the runtime modules that hold code in the chunk (`modules`), and a run whose list differs from it fails and names
# the module. `web/hello-runtime-js-with-helper` is the same page with the helper left in the chunk (the other reading of
# the number: 16,191), gated at 16,600 so the target holds either way. `web/all-features-runtime-js` is the page that
# uses everything (the playground's bindings with recovery, a panic handler, stats, snapshot, restore and a background
# run): its first chunk plus every chunk of the runtime it loads on demand, 40,100 (27,355 + 12,745) from 42,385; its
# budget is the old figure, 42,400: the first chunk may shed bytes to chunks a page loads on demand, a page that uses
# everything may not load more.
# The review of ts-runtime-16k put three things back up front or into both builds (ADR-057, "Review"): `snapshot` and
# `restore` run at the call (their order with the calls around them is their meaning), the page's background window
# calls `run_background` itself (a page being left, or offline, cannot fetch a chunk), and a port error's field and a
# close frame's reason are sentences in both builds. Recorded after it: 15,811 (190 under the budget), with the helper
# 16,333, all features 40,221 (27,455 + 12,766). After L3 (the framed channel) and the merge of reload-handles (ADR-059:
# no query-handle re-creation in recovery): 15,774 (226 under), with the helper 16,285, all features 39,922 (27,064 +
# 12,858). After the production message's separator became `; see` (2026-10-03: no em-dash in program output): 15,758
# (242 under), with the helper 16,284, all features 39,919 (27,055 + 12,864). The next change that grows the chunk by 242
# bytes is over the budget: make room (ADR-057's levers not taken: host events by use first, about 530) or restate it in
# an ADR.
[size."web/hello-runtime-js"]
budget_gzip_bytes = 16000
measured_gzip_bytes = 15758
tolerance = 0.05

[size."web/hello-runtime-js-with-helper"]
budget_gzip_bytes = 16600
measured_gzip_bytes = 16284
tolerance = 0.05

[size."web/all-features-runtime-js"]
budget_gzip_bytes = 42400
measured_gzip_bytes = 39919
tolerance = 0.05

# The native cores (ADR-052, amendment "native size gates", 2026-10-02): the hello-world core, the `undra init` template
# (a store with a keyed list and two computeds, a record, an enum, an error, a function; no query) built by `undra build
# --release`, which is the `release-mobile` profile of the generated shim (`release` with opt-level "s", the call-path crates
# undra-wire, undra-signals, undra-runtime and undra-ffi at 3; panic stays "unwind", R6), by `scripts/native-size.sh`. The budget is the design's (docs/blueprint.html, section 14): 1.2 MB per Android
# ABI, 900 KB added to an iOS app; the gate is the record plus 5%. Before the profile the same template was 987,720 bytes
# for arm64-v8a and 1,054,336 for x86_64 (main at b909739), and the iOS slice added 859,845 (95% of its 900 KB). To re-measure (a minute
# or two):
#   scripts/native-size.sh                     gate what this machine can build (--platform android | ios)
#   scripts/native-size.sh --record            ... and re-record bench/results/native-size.jsonl and these tables
# KB is 1,000 bytes. Android: the bytes of the stripped, 16 KB aligned lib<ns>.so that Gradle packages (NDK r27, cargo-ndk).
# iOS: the sections of the device slice linked as an app's link keeps them (-dead_strip, strip -x); the .a file is no measure
# (it grows at opt-level "z" while the code shrinks), see the script's header. Cross-checked against a minimal executable that
# references the core's entry: its sections grow by 0.9% less than the row says, its __LINKEDIT by 0.9% more (ADR-052's amendment).
[size."android/hello-arm64-v8a"]
budget_bytes = 1200000
measured_bytes = 898176
tolerance = 0.05

[size."android/hello-x86_64"]
budget_bytes = 1200000
measured_bytes = 960776
tolerance = 0.05

[size."ios/hello-arm64"]
budget_bytes = 900000
measured_bytes = 784086
tolerance = 0.05

