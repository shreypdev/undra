name: Bench

# Constitution R9: budgets are tests. This workflow runs the budgets test of the `undra-bench`
# crate, which times every benchmarked operation (wire round trips, dispatch, change-sets, keyed
# patches, snapshot and restore) with plain `Instant` and fails when the p50 of any of them is
# over its budget in `bench/budgets.toml`.
#
# The absolute budgets are HOST regression guards: about five times what an Apple-silicon laptop
# measures, so a shared ubuntu runner passes and an operation that became several times slower does
# not. They are not the blueprint's device targets (section 14: A15 iPhone, mid-range Android,
# Chromium); those are measured on devices in the playground phase and recorded in
# `bench/RESULTS.md`. A noisy run gets three attempts per operation (the best p50 counts).
# If a runner class is consistently slower, set UNDRA_BENCH_SCALE (for example 2) rather than
# loosening the file. `cargo bench -p undra-bench` (criterion) is for humans and is deliberately
# not run here.
#
# Two things catch what a 5x budget lets through (bench review M1: a commit path made 1.8x slower
# passed every absolute gate):
#   * RATIO gates (`[ratio."..."]` in budgets.toml) compare two rows measured in the same run, so
#     the runner's speed cancels. They run in every step below, on every runner.
#   * A BASELINE recorded from the BASE commit, in this same job on this same VM, minutes before the
#     head is measured (scripts/bench-record-base.sh: the head's harness against the base's crates).
#     The head must be within 1.5x of it on every row (p50, throughput; 2.5x for p99; the
#     cache-bound fan-out rows have `baseline_tolerance` 2 and 3 in budgets.toml). It is the
#     base measured here, not a number from another machine, because the ubuntu-latest pool is not
#     one machine class: the same row measured 1.1x to 3.3x apart across six runs. For a pull request
#     the base is the first parent of the merge ref; for a push it is the commit the push replaced.
#     When there is no base to measure (a new branch, a base that does not build against this
#     harness) the run carries a warning saying so, and the gates are the absolute budgets and the
#     ratios. A noisy row on the runner gets `baseline_tolerance` in its budgets.toml table (the
#     baseline is recorded afresh in every job, so it cannot carry one), never a looser default.
#     Minutes apart is still two moments of a shared runner (stream/backpressure measured 12 to 24
#     M/s on main with byte-identical code), so a sustained scenario that misses ONLY the baseline
#     is decided by three rounds of the base's binary and the head's in turn, best against best
#     (bench/tests/stress.rs, `interleave`): a slow stretch lowers both sides' rounds, a regression
#     only the head's.
#
# Harsh conditions (the stress and soak steps): the sustained scenarios of `bench/tests/stress.rs`
# run for 2 s each (UNDRA_STRESS_SECONDS) at rates far above any UI, with 8 threads completing port
# calls under a 60 Hz drain thread, alone and with a host thread writing the same store, and fail
# on a throughput floor, a tail ceiling, change-set bytes or RSS growth over their
# `[stress."..."]` table in `bench/budgets.toml`, or on a broken invariant (nothing lost, nothing
# reordered, the host list equals the core list, a stream never more than one item ahead of its
# credit). Then the soak runs the mixed paced load of a busy app for 10 s and fails on RSS growth,
# p99 drift (the trend of the second half, and one bad second), a broken invariant or a host that
# could not carry the load; each attempt is a fresh process. A noisy run gets three attempts per
# scenario (two for the soak); an invariant that breaks is never retried. UNDRA_BENCH_SCALE applies
# to rates and latencies here too, never to bytes, RSS, invariants or a baseline. These are
# core-side host numbers: what a platform does with a change-set afterwards is measured on the
# platform (`bench/RESULTS.md`, "Harsh conditions").
#
# Every run uploads the JSON behind its numbers (UNDRA_BENCH_RESULTS_DIR) as an artifact.
#
# Size (the `size` job, ADR-052): scripts/wasm-size.sh builds the `undra init` template for the web
# exactly as an app does (release-wasm, then wasm-opt -Oz from a pinned binaryen, so every run
# measures the optimised module with the same optimiser) and fails when the gzipped wasm is over
# `[size."web/hello-wasm"]` in bench/budgets.toml: the 120 KB budget, or 5% over the recorded size,
# whichever is lower. What the hello app loads up front of the JavaScript runtime is gated the same way by
# `[size."web/hello-runtime-js"]` (16 KB; its runtime modules are in the record and a changed list fails), with
# `[size."web/hello-runtime-js-with-helper"]` (Vite's preload helper counted in, 16.6 KB) and
# `[size."web/all-features-runtime-js"]` (the page that uses everything, 42.4 KB) beside it (ADR-057),
# and a run that cannot measure them fails. A change that
# grows one on purpose re-records with `scripts/wasm-size.sh --record` in the same commit; CI never
# records. Sizes do not depend on the runner's speed, so there is no scale and no baseline here.
#
# Native size (ADR-052, amendment "native size gates"): scripts/native-size.sh builds the same template with
# `undra build --release` (the size-tuned `release-mobile` profile of the generated shim, which keeps `panic = "unwind"`)
# and fails when the hello-world core is over its `[size."android/hello-arm64-v8a"]`, `[size."android/hello-x86_64"]` or
# `[size."ios/hello-arm64"]` table in bench/budgets.toml: the design's 1.2 MB per Android ABI and 900 KB added to an iOS
# app, or 5% over the record, whichever is lower. The Android libraries are measured in the `size` job (NDK r27 and
# cargo-ndk, the versions the record was measured with); the iOS slice needs Apple's linker, so it has a macOS job of its own,
# `size-ios`. A change that grows one on purpose re-records with `scripts/native-size.sh --record` in the same commit.

on:
  push:
    branches: [main]
  # Pull requests and the merge queue run this through the Gate workflow (.github/workflows/gate.yml), which calls it
  # and ends in the one required check; it runs by itself only on main.
  workflow_call:

concurrency:
  # A pull request's newer run replaces its older one, and so does a newer push to a piece's branch
  # `wt/<slug>` (docs/AGENT_WORKFLOW.md: a piece lands only on a green run of its exact head): each
  # run compares the whole pull request or branch with its base. A push to main is NEVER cancelled
  # (one group per commit): its baseline is the
  # commit the push replaced, so a cancelled run would leave that push compared with nothing, and
  # the next push would be gated against it, regression included. (Before this, a merge followed a
  # minute later by its state commit had the merge's run cancelled: 36803857331, 36808385622.)
  group: bench-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/wt/')) && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # Runner classes measured 3.5x-6.2x slower than the M5 host in Oct 2026 (signals/changeset_100/cell
  # hit 6.2x on one runner), against the 5x assumption the host budgets were set with. 2x more
  # headroom keeps the absolute gates honest about a real regression while they stop failing on the
  # slowest runner. It does not touch the ratio gates or the baseline gate (it would defeat them).
  UNDRA_BENCH_SCALE: "2"
  CARGO_TERM_COLOR: always
  UNDRA_BENCH_RESULTS_DIR: ${{ github.workspace }}/bench-results

jobs:
  budgets:
    name: Budgets (host, release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge ref has the base as its first parent.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          # A key of its own since the base build: rust-cache saves only on a miss, and the cache
          # of the earlier key had no target/bench-base, so the base's dependencies would have been
          # built cold on every run until Cargo.lock or the toolchain changed. rust-cache keeps a
          # nested target directory's dependencies and drops its workspace crates, like target/'s.
          key: with-base-target
      - name: Baseline from the base commit (same VM)
        id: base
        # A base that does not build against this harness must not fail the job: the gates below
        # then run without it. It must not be silent either: a warning on the run says so.
        continue-on-error: true
        env:
          BASE_REV: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          PIECE_BRANCH: ${{ startsWith(github.ref, 'refs/heads/wt/') }}
        run: |
          if [ "$PIECE_BRANCH" = true ]; then
            # A piece's branch is compared with where it left main, as a pull request is with its base (not with its
            # previous head: the first push of a branch has none, and a state commit on top would compare with nothing).
            git fetch --no-tags --depth=200 origin main
            BASE_REV="$(git merge-base HEAD FETCH_HEAD || true)"
          fi
          case "$BASE_REV" in
            ''|0000000000000000000000000000000000000000)
              echo "::warning title=No baseline gate::no base commit to measure against; this run is gated by the absolute budgets and the ratios only"
              exit 0 ;;
          esac
          if scripts/bench-record-base.sh "$BASE_REV" "$RUNNER_TEMP/base-baseline.toml" 2; then
            echo "path=$RUNNER_TEMP/base-baseline.toml" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No baseline gate::the base $BASE_REV could not be measured with this harness (see the step's log); this run is gated by the absolute budgets and the ratios only, which miss most regressions under 2x"
          fi
      - name: Budgets
        env:
          UNDRA_BENCH_BASELINE: ${{ steps.base.outputs.path }}
        run: cargo test -p undra-bench --test budgets --release -- --nocapture
      - name: Harsh conditions (sustained scenarios)
        env:
          UNDRA_BENCH_BASELINE: ${{ steps.base.outputs.path }}
        run: cargo test -p undra-bench --test stress --release -- --nocapture
      - name: Soak (10 s)
        run: cargo run -p undra-bench --release --bin soak -- --seconds 10 --attempts 2
      # The criterion benches are for humans and are not timed here, but they must still run:
      # `--test` runs each once. (The query bench's platform calls broke unnoticed once, when the
      # query layer stopped linking itself, ADR-052.)
      - name: Criterion benches run (each once, untimed)
        run: cargo bench -p undra-bench --benches -- --test
      - name: The JSON behind the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results
          if-no-files-found: ignore

  # The job's name keeps saying "Web size" (a check may be required by that name); it also gates the Android cores, in the
  # two steps after the web ones.
  size:
    name: Web size (hello-world wasm and JS runtime, gzip -9)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The Rust that CI pins (main pins 1.99.0 in every workflow; the deliberate bump re-records the
      # size with `scripts/wasm-size.sh --record` and `scripts/native-size.sh --record` in the same commit, since codegen
      # moves the bytes).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          # The template's build lives in target/wasm-size/target; a key of its own keeps it apart
          # from the budgets job's cache.
          key: wasm-size
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/ts/@undra/runtime/package-lock.json
      # Pinned: wasm-opt's output size moves between binaryen releases, and Ubuntu's package is
      # years behind the version the record was measured with.
      - name: Install binaryen version_133
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: The TypeScript runtime's dependencies (its share is gated next to the wasm)
        working-directory: runtimes/ts/@undra/runtime
        run: npm ci
      - name: Size gate
        run: |
          # The optimiser on PATH must be the pinned one, not one the runner image happens to have.
          wasm-opt --version | tee /dev/stderr | grep -q "version 133"
          bash scripts/wasm-size.sh
      - name: The JSON behind the number
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-size
          path: bench-results/web-size.jsonl
          if-no-files-found: ignore
      # cargo-ndk is what `undra build --platform android` runs; the NDK is the version the record was measured with (the image
      # carries others; the Android cross-build job of ci.yml installs the same one).
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: The NDK r27 (the Android cores are linked with it)
        run: |
          bash scripts/android-sdk-install.sh "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Native size gate (Android, hello-world core per ABI, bytes as shipped)
        run: bash scripts/native-size.sh --platform android
      - name: The JSON behind the Android numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-android
          path: bench-results/native-size.jsonl
          if-no-files-found: ignore

  size-ios:
    name: iOS size (hello-world core, device slice linked and stripped)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-size-ios
      - name: Native size gate (iOS)
        run: bash scripts/native-size.sh --platform ios
      - name: The JSON behind the iOS number
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-ios
          path: bench-results/native-size.jsonl
          if-no-files-found: ignore

  # This workflow's own roll-up: green only when every job above succeeded (a failed, cancelled or skipped job fails it;
  # `if: always()` so it reports after failures too). The Gate workflow needs it for every workflow it calls, and
  # ends in the one check the ruleset requires. Named "Complete" so that only the Gate's last job is called "All green".
  complete:
    name: Complete
    if: always()
    needs: [budgets, size, size-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
