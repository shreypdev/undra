name: CI

on:
  push:
    branches: [main]
  # Pull requests and the merge queue run this through the Gate workflow (.github/workflows/gate.yml), which calls it
  # and ends in the one required check; it runs by itself only on main.
  workflow_call:

# A piece's branch `wt/<slug>` is built on every push: a piece lands on main only when CI, Bench, Two cores (and Site, when the
# branch touches its paths) are green on that branch's exact head (docs/AGENT_WORKFLOW.md, `scripts/wt.sh merge`). A newer push
# to a wt/** branch cancels the run it supersedes. A run on main is never cancelled: each commit has a group of its own (a pending
# run in a group shared by main's commits is replaced by the next one, which drops a result that matters;
# .10x/reviews/2026-10-01-bench-followups-review.md, H2).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust version is pinned, not "stable": the compile-fail goldens (trybuild) quote rustc's
# wording and the bench budgets are baselined on one compiler, so a new stable release must land
# as a deliberate commit that bumps every `rust-toolchain@` line here, in bench.yml, release.yml,
# rn-devices.yml, site.yml and two-cores.yml together, regenerates the goldens (TRYBUILD=overwrite)
# and re-baselines the budgets and the web size. 1.99.0 (2026-10-01) is what is pinned: the commit that
# bumped to it replaced `fetch_update` (by `cas_update`) and regenerated the goldens, whose const-eval
# panics it rewords. The next stable waits for its own such commit.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # First, before any toolchain: it needs only git and fails in seconds.
      - name: No em-dash (U+2014) in any tracked file (scripts/check-no-em-dash.sh, and its test)
        run: |
          bash scripts/check-no-em-dash.test.sh
          bash scripts/check-no-em-dash.sh
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TS runtime dev dependencies (the bindgen fixtures compile it with tsc)
        working-directory: runtimes/ts/@undra/runtime
        run: npm ci
      - name: Format
        run: cargo fmt --check
      - name: Shared wire vectors (the Swift copy matches contract-tests/wire-vectors.json)
        run: bash runtimes/swift/scripts/sync-vectors.sh --check
      - name: Device bench report (RESULTS.md's device tables are what the result files say; the blueprint targets match)
        run: node --test scripts/bench-device-report.test.mjs
      - name: Generated-code measurement (scripts/generated-weight.mjs classifies the lines of a tree, ADR-062)
        run: node --test scripts/generated-weight.test.mjs
      - name: wt.sh merge's CI check (its parsing of `gh run list`, against fixtures)
        run: bash scripts/wt-ci-check.test.sh
      - name: wt.sh merge and clean (the push, the verification and the deletions, against scratch repositories)
        run: bash scripts/wt-cleanup.test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: The release version script (every file it owns moves, on a copy, with a throwaway version; ADR-063)
        run: bash scripts/bump-version.test.sh
      # The cookbook (examples/cookbook) and Fieldbook (examples/fieldbook): their bindings are what the
      # core generates, the TypeScript lines the cookbook pages show compile, and Fieldbook's web app runs
      # its generated bindings against the real wasm core (npm test) and bundles (npm run build).
      - name: Cookbook and Fieldbook bindings are current (undra bindgen --check)
        run: |
          cargo build -p undra-cli
          target/debug/undra bindgen -C examples/cookbook --check --docs
          target/debug/undra bindgen -C examples/fieldbook --check --docs
      - name: The real-time recipe and Fieldbook's presence over the opt-in ports (ADR-047)
        run: |
          cargo test -p cookbook --features realtime
          cargo test -p fieldbook-core --features presence
      - name: Cookbook TypeScript lines compile (tsc --strict)
        run: bash examples/cookbook/snippets/check.sh ts
      - name: Fieldbook web (bindings over the real wasm core, then the bundle)
        working-directory: examples/fieldbook/web
        run: |
          npm ci --no-audit --no-fund
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" npm test
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" npm run build
      # `cargo test --workspace` above skips the heavy halves of these (they run real builds); here they
      # must run. The web app's build through the Vite plugin needs the npm registry; `undra upgrade`
      # end to end builds the core from a local clone. Gradle runs in the android job, Xcode in macos.
      - name: Build integrations (Vite plugin), undra upgrade end to end, the CI workflow, undra doctor
        run: UNDRA_REQUIRE_TOOLCHAINS=1 cargo test -p undra-cli --test build_systems --test upgrade --test ci_workflow --test doctor -- --skip xcode_builds --skip xcode_without --skip gradle_builds --skip gradle_without
      - name: The write rule in release (ADR-035; the audit's off-core writes were release-only)
        run: cargo test --release -p undra-runtime --test write_context -p undra-signals --test write_checker
      - name: Clippy (undra-ffi on wasm32)
        run: cargo clippy -p undra-ffi --target wasm32-unknown-unknown -- -D warnings
      - name: C ABI acceptance (undra.h with -Werror; the host contract under ASan)
        run: UNDRA_C_SANITIZE=1 bash crates/undra-ffi/tests/c/run.sh
      - name: Loaded cdylib keeps its schema + JNI exports (ADR-029 regression), and its docs equal the dev runner's
        run: cargo test -p undra-cli --test schema_retention --test schema_docs -- --ignored --nocapture
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: wasm32 build (core crates)
        run: |
          for p in undra-meta undra-wire undra-signals undra-runtime undra-ports undra-query undra-testkit undra-ffi undra playground-core cookbook fieldbook-core; do
            cargo build -p $p --target wasm32-unknown-unknown
          done

  # ADR-042: the types of other crates that cross as a wire leaf are opt-in features of `undra`. Each must
  # build for every platform the core ships to, and none may bring a clock or randomness along (R12): a
  # `chrono` with `clock` or a `uuid` with `v4` would pull `wasm-bindgen` and `getrandom` into the wasm core.
  leaf-features:
    name: Leaf-type features (uuid, chrono, time, rust_decimal, bytes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Tests with every feature on (the codecs, the facade, the macros that name a missing feature)
        run: |
          features=uuid,chrono,time,rust_decimal,bytes
          cargo test -p undra-wire --features $features
          cargo test -p undra --features $features
          cargo test -p undra-macros --lib --features $features
      - name: Each feature builds for wasm32, iOS and Android
        run: |
          for target in wasm32-unknown-unknown aarch64-apple-ios aarch64-linux-android; do
            for feature in uuid chrono time rust_decimal bytes; do
              cargo build -p undra-wire --features $feature --target $target
              cargo build -p undra --features $feature --target $target
            done
          done
      - name: No clock and no randomness comes with them
        run: |
          if cargo tree -p undra --features uuid,chrono,time,rust_decimal,bytes -e features,normal --target wasm32-unknown-unknown | grep -E 'getrandom|wasm-bindgen|js-sys|iana-time-zone'; then
            echo "a leaf-type feature pulled a clock or randomness source into the core (R12)"
            exit 1
          fi

  ts:
    name: TypeScript runtime
    runs-on: ubuntu-latest
    env:
      # The runtime's call-path guard (test/call-path.test.ts, the `[web."node/..."]` budgets of bench/budgets.toml; read by
      # scripts/web-budgets.mjs) is the one test of this workflow that holds an absolute time to a budget. Runner classes
      # measured 3.5x-6.2x slower than the M5 host in Oct 2026, against the 5x the budgets were set with; the same
      # 2x of headroom bench.yml carries keeps the guard honest about a real regression and stops it failing on the slowest
      # runner (callSync measured 952 ns against 800 ns). It scales ceilings only. No other job runs the test.
      UNDRA_BENCH_SCALE: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        working-directory: runtimes/ts/@undra/runtime
        run: |
          npm ci
          npm test
      # ADR-057: the package publishes a production build whose private properties are renamed. The same suite, run against it (the
      # sources' own tests of the build: `scripts/mangle.mjs`, the flavours).
      - name: Test against the production build (renamed private properties)
        working-directory: runtimes/ts/@undra/runtime
        run: npm run test:dist
      # The testing kit (docs/TESTING.md): its tests, and its build config, which compiles against the runtime's emitted declarations.
      - name: Testing kit (@undra/testkit)
        run: |
          (cd runtimes/ts/@undra/runtime && npm run build)
          cd runtimes/ts/@undra/testkit
          npm ci
          npm test
          UNDRA_TS_DIST="$GITHUB_WORKSPACE/runtimes/ts/@undra/runtime/dist/index.js" npm test
          npm run typecheck
      # The devtools page of `undra dev` (ADR-054): its tests, and the committed assets must be what its
      # sources build to (the CLI embeds them, so `cargo build` needs no Node).
      - name: Devtools page (typecheck, tests, committed assets equal a rebuild, size budget)
        working-directory: runtimes/ts/devtools
        run: |
          npm ci
          npm run typecheck
          npm test
          UNDRA_TS_DIST="$GITHUB_WORKSPACE/runtimes/ts/@undra/runtime/dist/index.js" npm test
          bash build.sh --check

  kotlin:
    name: Kotlin runtime (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install kotlinc
        run: |
          curl -sSfL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch kotlinx-coroutines
        run: |
          mkdir -p "$HOME/lib"
          curl -sSfLo "$HOME/lib/kotlinx-coroutines-core-jvm-1.6.4.jar" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.6.4/kotlinx-coroutines-core-jvm-1.6.4.jar
          # The SQLite JDBC driver of the Db port's JVM tests and the Kotlin S25 column (ADR-048);
          # never a dependency of the runtime module.
          curl -sSfLo "$HOME/lib/sqlite-jdbc-3.53.4.0.jar" \
            https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.53.4.0/sqlite-jdbc-3.53.4.0.jar
          echo "47e21dd53efe1524fe0df6965cb65003ffe17172  $HOME/lib/sqlite-jdbc-3.53.4.0.jar" | sha1sum -c -
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the JNI library (the fixture core, namespace undra_fixture)
        run: cargo build --manifest-path crates/undra-ffi/tests/fixture/Cargo.toml
      - name: Test (incl. JNI smoke against the real library)
        env:
          UNDRA_KOTLINX_COROUTINES: /home/runner/lib/kotlinx-coroutines-core-jvm-1.6.4.jar
          UNDRA_SQLITE_JDBC: /home/runner/lib/sqlite-jdbc-3.53.4.0.jar
          UNDRA_NATIVE_LIB_DIR: ${{ github.workspace }}/crates/undra-ffi/tests/fixture/target/debug
        run: runtimes/kotlin/undra-runtime/scripts/test-local.sh

  wasm-ffi:
    name: wasm ABI (real module, TS runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the TypeScript runtime's dependencies
        working-directory: runtimes/ts/@undra/runtime
        run: npm ci
      # run.sh builds the TypeScript runtime from source into a scratch directory and fails (it does
      # not skip) when it cannot, so this leg can neither be stale nor silently absent.
      - name: wasm acceptance (raw host + TS runtime)
        run: bash crates/undra-ffi/tests/wasm/run.sh
      # The same acceptance against the package's production build (ADR-057: private properties renamed, messages as codes).
      - name: wasm acceptance against the production build
        run: |
          (cd runtimes/ts/@undra/runtime && npm run build)
          UNDRA_TS_DIST="$GITHUB_WORKSPACE/runtimes/ts/@undra/runtime/dist/index.js" bash crates/undra-ffi/tests/wasm/run.sh

  macos:
    name: Swift runtime + C ABI (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Swift tests
        working-directory: runtimes/swift/UndraRuntime
        run: swift test
      # ADR-063: apps add the repository itself as their Swift package; its root manifest builds the same sources.
      - name: The repository's root Package.swift builds (what an app depends on)
        run: |
          swift build --package-path . --scratch-path "$RUNNER_TEMP/spm-root"
          cargo test -p undra-cli --test swift_manifests
      - name: Generated Swift compiles against the runtime (every golden case; ADR-024 amendment)
        run: UNDRA_REQUIRE_TOOLCHAINS=1 cargo test -p undra-bindgen --test typecheck_swift
      - name: Swift-over-C-ABI acceptance
        run: bash crates/undra-ffi/tests/swift/run.sh
      - name: C ABI acceptance (undra.h with -Werror; the host contract under ASan)
        run: UNDRA_C_SANITIZE=1 bash crates/undra-ffi/tests/c/run.sh
      - name: Loaded cdylib keeps its schema + JNI exports (ADR-029 regression, macOS dead-strip), and its docs equal the dev runner's
        run: cargo test -p undra-cli --test schema_retention --test schema_docs -- --ignored --nocapture
      - name: iOS cross-build (device + simulator)
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo check -p undra-ffi --target aarch64-apple-ios
          cargo check -p undra-ffi --target aarch64-apple-ios-sim
      - name: Xcode builds the core in its Run Script phase (undra init's project; Debug, Release, Debug)
        run: UNDRA_REQUIRE_TOOLCHAINS=1 cargo test -p undra-cli --test build_systems -- xcode --nocapture
      - name: Cookbook Swift lines compile (Swift 6, over the generated bindings)
        run: bash examples/cookbook/snippets/check.sh swift
      - name: Fieldbook's iOS app builds (the Run Script phase builds the core)
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo build -p undra-cli
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" xcodebuild -project examples/fieldbook/ios/Fieldbook.xcodeproj \
            -scheme Fieldbook -destination 'generic/platform=iOS Simulator' build
      # The playground's SwiftUI previews (#Preview over UndraTestKit) are compiled with the app: a Debug build of it.
      - name: The playground's iOS app builds, SwiftUI previews and the testing kit included
        run: |
          cargo build -p undra-cli
          target/debug/undra build -C examples/playground --platform ios
          xcodebuild -quiet -project examples/playground/ios/PlaygroundApp.xcodeproj -scheme PlaygroundApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' build

  ios-floor:
    # ADR-045, docs/IOS_15_16.md: an app that supports iOS 15 and 16 gets ObservableObject stores and the runtime's UndraDuration.
    # Everything here is scripts/ios-floor.sh, so a machine runs the same steps: the runtime for the iOS 15.0 simulator, every golden
    # case of the generator in this mode for iOS 15.0 and 16.0, examples/ios15-sample (deployment target 15.0) with xcodebuild, the
    # playground's and Fieldbook's bindings generated for iOS 15 and compiled for it (their apps stay on 17, which is the default
    # job above), and the Swift contract grid against the iOS 15 bindings. Running the sample needs an iOS 15 or 16 simulator
    # runtime, which the hosted image may not have (the last step says which); the build is the guarantee.
    name: iOS 15 / 16 floor
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: iOS targets of the core, and the undra CLI
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo build -p undra-cli
      - name: The runtime, the golden cases and the sample build at the floor
        run: scripts/ios-floor.sh runtime golden sample
      - name: The playground's and Fieldbook's bindings generated for iOS 15 compile for it
        run: scripts/ios-floor.sh apps
      - name: Swift contract scenarios against bindings generated for iOS 15
        run: scripts/ios-floor.sh contract
      - name: The observation path at run time on the image's simulator, and the sample on an iOS 15 or 16 runtime when it has one
        run: |
          xcrun simctl list runtimes
          scripts/ios-floor.sh probe simulator

  android:
    name: Android cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build the JNI library for both ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 build -p undra-ffi --features jni
      # Gradle's undraBuild task over undra init's Android app (debug, release, debug again). It needs a
      # JDK 17, platform 35 and NDK r27 besides cargo-ndk; UNDRA_TEST_BUILD_SYSTEMS (not REQUIRE) runs it
      # when the runner image has them and prints why it skipped when it does not.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle builds the core in its undraBuild task
        run: |
          bash scripts/android-sdk-install.sh "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          UNDRA_TEST_BUILD_SYSTEMS=1 cargo test -p undra-cli --test build_systems -- gradle --nocapture
      - name: Fieldbook's Android app assembles (Gradle's undraBuild task builds the core)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo build -p undra-cli
          cd examples/fieldbook/android
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" ./gradlew :app:assembleDebug --console=plain
      # The playground's Compose previews (@Preview over dev.undra:testkit, a debug dependency) are compiled with the app.
      - name: The playground's Android app builds, Compose previews and the testing kit included
        working-directory: examples/playground/android
        run: ./gradlew --no-daemon :app:assembleDebug
      # The optional OkHttp module (ADR-060): its three adapters pass the shared adapter contracts on the JVM, against the
      # loopback servers of test-support, so a change to the contracts or to OkHttp's behaviour is caught here, not on a device.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The OkHttp adapters pass the shared adapter contracts (JVM)
        working-directory: runtimes/kotlin/undra-runtime
        run: UNDRA_REQUIRE_TOOLCHAINS=1 ./gradlew --no-daemon :okhttp-adapters:testDebugUnitTest --console=plain

  ffi-miri:
    # macOS, not Linux: Miri's strict c-variadic check currently flags parking_lot_core's
    # Linux futex call (upstream toolchain friction, not our code); the macOS backend has
    # no futex path and checks the same undra-ffi code.
    name: undra-ffi under Miri
    runs-on: macos-15
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Miri (unit tests; FFI-callback tests excluded)
        run: cargo +nightly miri test -p undra-ffi --lib
      - name: Miri (host-allocated port replies, out_reply is always free()d)
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly miri test -p undra-ffi --test abi -- \
            a_host_that_sets_cap sync_port_answers

  ffi-asan:
    name: undra-ffi under ASan
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: AddressSanitizer (memory safety; host_contract is the port-callback lifetime regression)
        # The memory-safety targets only. `sync_alloc` asserts EXACT Rust allocation counts, which
        # ASan instrumentation perturbs (it is a performance-accounting test, not a safety one, and
        # runs unmodified in the normal Rust job).
        run: |
          RUSTFLAGS="-Z sanitizer=address" cargo +nightly test -p undra-ffi \
            --target x86_64-unknown-linux-gnu --lib --test abi --test host_contract

  contracts:
    name: Contract scenarios (TS + Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          curl -sSfL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch kotlinx-coroutines
        run: |
          mkdir -p "$HOME/lib"
          curl -sSfLo "$HOME/lib/kotlinx-coroutines-core-jvm-1.6.4.jar" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.6.4/kotlinx-coroutines-core-jvm-1.6.4.jar
          # The SQLite JDBC driver of the Db port's JVM tests and the Kotlin S25 column (ADR-048);
          # never a dependency of the runtime module.
          curl -sSfLo "$HOME/lib/sqlite-jdbc-3.53.4.0.jar" \
            https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.53.4.0/sqlite-jdbc-3.53.4.0.jar
          echo "47e21dd53efe1524fe0df6965cb65003ffe17172  $HOME/lib/sqlite-jdbc-3.53.4.0.jar" | sha1sum -c -
      - name: Run the scenario runners
        env:
          UNDRA_KOTLINX_COROUTINES: /home/runner/lib/kotlinx-coroutines-core-jvm-1.6.4.jar
          UNDRA_SQLITE_JDBC: /home/runner/lib/sqlite-jdbc-3.53.4.0.jar
          # The Kotlin contract runner requires the stdlib path explicitly (it does not derive
          # it from the kotlinc location the way test-local.sh does).
          UNDRA_KOTLIN_STDLIB: /home/runner/kotlin/kotlinc/lib/kotlin-stdlib.jar
        run: bash contract-tests/run-all.sh ts kotlin
      # The TypeScript column again, against the runtime's production build (ADR-057: private properties renamed).
      - name: TypeScript contract scenarios against the production build
        run: |
          (cd runtimes/ts/@undra/runtime && npm ci --no-audit --no-fund && npm run build)
          UNDRA_TS_DIST="$GITHUB_WORKSPACE/runtimes/ts/@undra/runtime/dist/index.js" bash contract-tests/ts/run.sh
      - name: Cookbook Kotlin lines compile (kotlinc -Werror, over the generated bindings)
        env:
          UNDRA_KOTLINX_COROUTINES: /home/runner/lib/kotlinx-coroutines-core-jvm-1.6.4.jar
        run: bash examples/cookbook/snippets/check.sh kotlin

  contracts-swift:
    name: Contract scenarios (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the Swift scenario runner
        run: bash contract-tests/run-all.sh swift

  # ADR-061: the Bazel rules (bazel/) and their example workspace (examples/bazel). `bazel test //...` builds the to-do core for the
  # host and the web with the pinned Rust 1.99.0 that Bazel fetches (rules_rust, by checksum), generates the bindings from the host
  # library, compiles the Kotlin and TypeScript consumers and runs them against the real core (JNI, Node), and runs ktlint over the
  # generated Kotlin with and without the exclusions `undra bindgen` writes. Bazel is pinned by .bazelversion (Bazelisk; the example's
  # is a link to bazel/'s), the rulesets by MODULE.bazel, whose lock file is committed. The lock is not run with
  # --lockfile_mode=error here: it records what the machine that wrote it resolved, per OS, and a Linux runner would fail on every
  # entry a macOS developer made.
  bazel-example:
    name: Bazel example
    runs-on: ubuntu-latest
    env:
      BAZELISK_VERSION: v1.29.0
      # The sha256 of that release's bazelisk-linux-amd64.
      BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
    steps:
      - uses: actions/checkout@v4
      - name: Install Bazelisk
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfLo "$RUNNER_TEMP/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          echo "$BAZELISK_SHA256  $RUNNER_TEMP/bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # What the rulesets download (the Rust toolchain, the JDK, Node, binaryen, the crates): Bazel's repository cache, keyed by the
      # lock files that name them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('examples/bazel/MODULE.bazel.lock', 'bazel/MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      - name: The rules' own tests (the Cargo.lock reader)
        working-directory: bazel
        run: bazel test //tests/... --repository_cache="$HOME/.cache/bazel-repository" --test_output=errors
      - name: bazel test //... (host and web cores, bindings, Kotlin and TypeScript consumers, ktlint)
        working-directory: examples/bazel
        run: bazel test //... --repository_cache="$HOME/.cache/bazel-repository" --test_output=errors

  # What only macOS can run, where rules_swift and the iOS core have Xcode: the Swift consumer runs the core in process, and the
  # XCFramework (device and simulator slices) builds in a Bazel action. The Kotlin and TypeScript targets are the Linux job's.
  # Every change runs it, like the other macOS jobs: what moves its result is the Undra crates, the Swift runtime, the CLI and
  # the rules, which is nearly every change, and a job that can be skipped cannot be part of the roll-up.
  bazel-example-macos:
    name: "Bazel example (macOS, Swift and iOS)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Bazelisk
        run: brew install bazelisk
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('examples/bazel/MODULE.bazel.lock', 'bazel/MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      - name: The Swift consumer and the iOS core
        working-directory: examples/bazel
        run: |
          bazel test //swift/... --repository_cache="$HOME/.cache/bazel-repository" --test_output=errors
          bazel build //:mobile_ios --repository_cache="$HOME/.cache/bazel-repository"

  playground-web:
    # The playground's web app and its stories page (src/stories, rendered by stories.html with Vite alone; the modules are Component Story Format
    # over @undra/testkit): type-checked and built against the wasm core `undra build` makes.
    name: Playground web (app and stories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The undra CLI, then the playground core for the web
        run: |
          cargo build -p undra-cli
          target/debug/undra build -C examples/playground --platform web
      - name: Type-check and build the app and the stories page
        working-directory: examples/playground/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  react-native:
    # The React Native runtime without a device (docs/REACT_NATIVE.md, "What is tested where"): the C++ host
    # against the real core under ASan + UBSan, the JSI layer compiled against React Native 0.87's own headers
    # with -Werror, the package's unit tests on a fake module, and the contract scenarios through
    # NativeTransport over a stand-in of the module on the wasm core. What only a device can show (JSI under
    # Hermes, both builds, the vsync sources) is .github/workflows/rn-devices.yml.
    name: React Native (host + model)
    # ubuntu-24.04, not -latest: the host's Rng is arc4random_buf, which glibc has had since 2.36 (24.04 ships 2.39).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            runtimes/rn/@undra/react-native/package-lock.json
            runtimes/ts/@undra/runtime/package-lock.json
            examples/playground/rn/package-lock.json
      # clang with its sanitizer runtime: the C++ test is built with clang++ (-fsanitize=address,undefined),
      # and the JSI check needs clang's view of React Native's headers. Pinned to 18, the release of 24.04.
      - name: clang 18 and its sanitizer runtime
        run: |
          sudo apt-get update
          # libsqlite3-dev: the system SQLite the C++ Db binding's host test links (ADR-048).
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev libsqlite3-dev
          # The runner's kernel randomises mmap with more bits than ASan's shadow layout accepted until
          # recently; 28 is what LLVM's own CI sets (runner-images issue 9491).
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: The undra CLI, then the playground core for this machine (the C++ test) and the wasm cores of the contract column
        run: |
          cargo build -p undra-cli
          target/debug/undra build -C examples/playground --platform host
          # the C++ test's second core: the same crate under the namespace playground_a (ADR-044)
          target/debug/undra build -C examples/two-cores/a --platform host
          # the contract column's cores, none of them committed: build A and build B of the playground (S14, S15) and the
          # two-cores pair (S27), the same script the TypeScript column's run.sh starts with
          bash contract-tests/ts/build-cores.sh
      - name: The derived-list recording S19 replays (the contract column)
        run: bash contract-tests/derived-vectors.sh
      # The package's build config (tsconfig.build.json) compiles against @undra/runtime's emitted declarations,
      # as an app that installs both sees them; dist/ is not committed.
      - name: The TypeScript runtime's declarations
        working-directory: runtimes/ts/@undra/runtime
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Package dependencies
        working-directory: runtimes/rn/@undra/react-native
        run: npm ci --no-audit --no-fund
      # The playground app is installed only for the React Native 0.87 headers that the JSI check compiles
      # against (run.sh fails, it does not skip, when they are missing: UNDRA_RN_REQUIRE_JSI).
      - name: React Native headers (the playground app's dependencies)
        working-directory: examples/playground/rn
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: C++ host under ASan + UBSan (both shims), and the JSI layer against React Native's headers
        env:
          CXX: clang++-18
          UNDRA_RN_REQUIRE_JSI: "1"
          UNDRA_RN_REQUIRE_SQLITE: "1"
        run: runtimes/rn/@undra/react-native/cpp/test/run.sh
      # The pure Java of the package's Android library (the secure-store seal against an AES-GCM vector, the
      # network classification), with the runner's JDK; the Keystore and ConnectivityManager are device-checked.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The Android library's pure Java (javac, no SDK)
        run: runtimes/rn/@undra/react-native/android/test/run.sh
      - name: Unit tests (NativeTransport, frame scheduler, polyfills, loadNative, the default adapters)
        working-directory: runtimes/rn/@undra/react-native
        run: npm test
      - name: Typecheck (sources and the build config)
        working-directory: runtimes/rn/@undra/react-native
        run: npm run typecheck
      - name: Contract scenarios through NativeTransport (18 pass, S17 is app-tested)
        working-directory: runtimes/rn/@undra/react-native
        run: npm run test:contract
      # ADR-057: the unit tests and the scenarios again, against the runtime's production build (renamed private properties).
      - name: Unit tests and contract scenarios against the production build
        working-directory: runtimes/rn/@undra/react-native
        run: |
          export UNDRA_TS_DIST="$GITHUB_WORKSPACE/runtimes/ts/@undra/runtime/dist/index.js"
          npm test
          npm run test:contract

  # This workflow's own roll-up: green only when every job above succeeded (a failed, cancelled or skipped job fails it;
  # `if: always()` so it reports after failures too). The Gate workflow needs it for every workflow it calls, and
  # ends in the one check the ruleset requires. Named "Complete" so that only the Gate's last job is called "All green".
  complete:
    name: Complete
    if: always()
    needs: [rust, leaf-features, ts, kotlin, wasm-ffi, macos, ios-floor, android, ffi-miri, ffi-asan, contracts, contracts-swift, bazel-example, bazel-example-macos, playground-web, react-native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
