
  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: @@ANDROID_TARGETS@@
      - uses: Swatinem/rust-cache@v2
      - name: Set up the Android NDK r27
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
@@INSTALL_UNDRA@@      - name: Build (the undraBuild Gradle task builds the core first)
        working-directory: android
        run: ./gradlew assembleDebug
      # The symbol files of the core (ADR-046): `undra build --release` strips the library that ships and keeps the
      # unstripped one below build/symbols/android (and native-debug-symbols.zip, the Play Console layout). Keep them with
      # the build; upload them to Crashlytics (unstrippedNativeLibsDir), Sentry or the Play Console, and resolve a crash
      # report by hand with `undra symbolicate report.json --symbols <the unpacked artifact>`.
      - name: Symbol files (release build of the core)
        if: github.event_name == 'push'
        run: undra build --platform android --release
      - name: Upload the symbol files
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: @@NAMESPACE@@-android-symbols
          path: build/symbols/
          if-no-files-found: error
